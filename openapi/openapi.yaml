          type: integer
        id_usuario:
          type: integer
        correo:
          type: string
        nombre_completo:
          type: string
        telefono:
          type: [string, 'null']
        ubicacion:
          type: [string, 'null']
        resumen_perfil:
          type: [string, 'null']
        tipo_discapacidad:
          type: [string, 'null']
          description: Dato privado del candidato
        visible_discapacidad:
          type: boolean
          default: false
        cv_url:
          type: [string, 'null']
        fecha_creacion:
          type: string
          format: date-time
        habilidades:
          type: array
          items:
