openapi: 3.1.0
info:
  title: Enlaza API
  description: >
    API de Enlaza, plataforma web de empleo inclusivo para personas con
    discapacidad. El frontend usa esta especificación como fuente única
    de verdad para su cliente HTTP.
  license:
    name: Privado
  version: 0.6.0
servers:
  - url: http://localhost:4000/api
    description: Local
security:
  - {}
tags:
  - name: auth
    description: Registro, acceso y sesión de usuarios
  - name: archivos
    description: Subida de archivos (CV y logos)
  - name: candidatos
    description: Perfiles de candidatos
  - name: empresas
    description: Perfiles de empresas
  - name: vacantes
    description: Ofertas de empleo y su catálogo de ajustes
  - name: catalogos
    description: Catálogos de habilidades y tipos de ajuste razonable
  - name: postulaciones
    description: Postulaciones de candidatos a vacantes y sus estados
  - name: chatbot
    description: Asistente conversacional con IA
  - name: sello
    description: Sello de inclusión y su flujo de verificación
  - name: resenas
    description: Reseñas de candidatos sobre empresas
  - name: mentores
    description: Perfiles de mentores disponibles
  - name: mentorias
    description: Agenda de sesiones de mentoría
  - name: health
    description: Estado del servicio
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Estado de la API
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/registro:
    post:
      tags: [auth]
      operationId: registrarUsuario
      summary: Crear una cuenta y su perfil base
      description: >
        Crea un Usuario y el perfil correspondiente. Los roles
        candidato y mentor crean un perfil de candidato (el mentor además
        su registro de mentor); el rol empresa crea un perfil de empresa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UsuarioResponse'
        '409':
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [auth]
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: >
        Valida credenciales y emite un access token (en el cuerpo) y un
        refresh token (cookie HttpOnly).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Set-Cookie:
              description: Refresh token en cookie HttpOnly
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: rotarSesion
      summary: Rotar la sesión
      description: >
        Usa el refresh token (cookie) para generar un nuevo par de tokens
        y revocar el anterior. Emite cookies nuevas.
      responses:
        '200':
          description: Sesión renovada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Sesión inválida, expirada o revocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [auth]
      operationId: cerrarSesion
      summary: Cerrar sesión
      description: Revoca el refresh token de la cookie y limpia la cookie.
      responses:
        '204':
          description: Sesión cerrada
        '401':
          description: Sin sesión activa (aun así se limpia la cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [auth]
      operationId: usuarioActual
      summary: Usuario autenticado y su perfil
      description: >
        Devuelve el usuario de la sesión actual e ids de su perfil
        (id_candidato o id_empresa, el que corresponda).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    allOf:
                      - $ref: '#/components/schemas/UsuarioResponse'
                      - type: object
                        properties:
                          id_candidato:
                            type: [integer, 'null']
                            example: 1
                          id_empresa:
                            type: [integer, 'null']
                            example: null
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /candidatos/{id}:
    get:
      tags: [candidatos]
      operationId: obtenerCandidato
      summary: Ver un perfil de candidato
      description: >
        Solo el propio candidato o un administrador pueden ver el perfil.
        Los datos de tipo de discapacidad son privados.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      responses:
        '200':
          description: Perfil de candidato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CandidatoPerfil'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permiso sobre este perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [candidatos]
      operationId: actualizarCandidato
      summary: Editar un perfil de candidato
      description: >
        Actualiza los campos enviados del perfil. Solo el propio candidato
        o un administrador pueden editarlo. Al menos un campo es obligatorio.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidatoActualizar'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CandidatoPerfil'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permiso sobre este perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Id o datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /candidatos/{id}/recomendaciones:
    get:
      tags: [candidatos]
      operationId: candidatoRecomendaciones
      summary: Vacantes recomendadas para un candidato
      description: >
        Vacantes activas ordenadas por compatibilidad, calculada con la
        similitud coseno entre el embedding del perfil del candidato
        (resumen y habilidades) y el de cada vacante (título y descripción).
        Excluye las vacantes a las que el candidato ya se postuló.
        Solo el propio candidato o un administrador.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
        - name: page
          in: query
          description: Número de página
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Resultados por página (máximo 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Listado paginado de vacantes recomendadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ListadoRecomendaciones'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Solo el propio candidato o un administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Candidato no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Id o parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Generación de embeddings no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /empresas/{id}:
    get:
      tags: [empresas]
      operationId: obtenerEmpresa
      summary: Ver un perfil de empresa
      description: Solo la propia empresa o un administrador pueden verlo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      responses:
        '200':
          description: Perfil de empresa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EmpresaPerfil'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permiso sobre este perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [empresas]
      operationId: actualizarEmpresa
      summary: Editar un perfil de empresa
      description: >
        Actualiza los campos enviados del perfil. Solo la propia empresa
        o un administrador pueden editarlo. Al menos un campo es obligatorio.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaActualizar'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EmpresaPerfil'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permiso sobre este perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Id o datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vacantes:
    get:
      tags: [vacantes]
      operationId: listarVacantes
      summary: Listar vacantes
      description: >
        Listado público de vacantes según su estado (activas por defecto),
        con paginación y los ajustes ofrecidos por cada una.
      parameters:
        - name: estado
          in: query
          description: Estado de las vacantes a listar
          schema:
            type: string
            enum: [activa, cerrada, en_revision]
            default: activa
        - name: page
          in: query
          description: Número de página
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Resultados por página (máximo 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Listado paginado de vacantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ListadoVacantes'
        '422':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [vacantes]
      operationId: crearVacante
      summary: Crear una vacante
      description: >
        Publica una oferta de empleo y los ajustes razonables que ofrece.
        Solo la cuenta de empresa dueña o un administrador pueden crearla.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacanteInput'
      responses:
        '201':
          description: Vacante creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/VacanteResponse'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Solo las cuentas de empresa pueden crear vacantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos o ajustes inexistentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vacantes/buscar:
    get:
      tags: [vacantes]
      operationId: buscarVacantes
      summary: Buscar vacantes
      description: >
        Búsqueda pública por texto libre (usa el índice FULLTEXT sobre
        título y descripción), ubicación y modalidad, con paginación.
        El texto se ignora si es muy corto (menos de 3 caracteres).
      parameters:
        - name: texto
          in: query
          description: Texto libre sobre el título y la descripción
          schema:
            type: string
            maxLength: 200
        - name: ubicacion
          in: query
          description: Ubicación del puesto (coincidencia parcial)
          schema:
            type: string
            maxLength: 150
        - name: modalidad
          in: query
          description: Modalidad de trabajo
          schema:
            type: string
            enum: [presencial, remoto, hibrido]
        - name: page
          in: query
          description: Número de página
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Resultados por página (máximo 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Resultados de la búsqueda (solo vacantes activas)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ListadoVacantes'
        '422':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vacantes/{id}:
    get:
      tags: [vacantes]
      operationId: obtenerVacante
      summary: Ver detalle de una vacante
      description: Detalle público de una vacante con sus ajustes y la empresa publicante.
      parameters:
        - $ref: '#/components/parameters/RutaId'
      responses:
        '200':
          description: Detalle de la vacante
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/VacanteResponse'
        '404':
          description: Vacante no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [vacantes]
      operationId: actualizarVacante
      summary: Editar una vacante
      description: >
        Actualiza los campos enviados y, si se indican, reemplaza el set de
        ajustes ofrecidos. Solo la empresa dueña o un administrador pueden editarla.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacanteActualizar'
      responses:
        '200':
          description: Vacante actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/VacanteResponse'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Solo la empresa dueña o un administrador pueden editarla
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vacante no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos o ajustes inexistentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [vacantes]
      operationId: eliminarVacante
      summary: Eliminar una vacante
      description: >
        Elimina una vacante y sus relaciones. Solo la empresa dueña
        o un administrador pueden eliminarla.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      responses:
        '200':
          description: Vacante eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id_vacante:
                        type: integer
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Solo la empresa dueña o un administrador pueden eliminarla
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vacante no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vacantes/{id}/sugerir-ajustes:
    post:
      tags: [vacantes]
      operationId: sugerirAjustesVacante
      summary: Sugerir ajustes razonables para una vacante
      description: >
        Usa la API de Claude para recomendar ajustes razonables adecuados para
        el tipo de puesto, basándose en la normativa general de accesibilidad
        laboral. Solo se sugieren ajustes existentes en el catálogo de tipos de
        ajuste. Solo la empresa dueña de la vacante o un administrador.
        La clave de la API de IA nunca se expone al frontend.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      responses:
        '200':
          description: Ajustes razonables recomendados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AjusteSugerido'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Solo la empresa dueña o un administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vacante no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: El asistente de IA falló
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vacantes/{id}/alerta-lenguaje:
    get:
      tags: [vacantes]
      operationId: obtenerAlertaLenguaje
      summary: Consultar alerta de lenguaje excluyente de una vacante
      description: >
        Devuelve si la descripción de la vacante tiene lenguaje potencialmente
        excluyente o capacitista detectado por el analizador de IA y, en ese caso,
        una sugerencia de redacción alternativa inclusiva. Solo la empresa dueña
        de la vacante o un administrador.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      responses:
        '200':
          description: Detalle de la alerta de lenguaje
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AlertaLenguaje'
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Solo la empresa dueña o un administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vacante no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /habilidades:
    get:
      tags: [catalogos]
      operationId: listarHabilidades
      summary: Listar catálogo de habilidades
      description: Catálogo público de habilidades, opcionalmente filtrado por categoría.
      parameters:
        - name: categoria
          in: query
          description: Filtrar por categoría (coincidencia exacta)
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: Habilidades del catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Habilidad'
        '422':
