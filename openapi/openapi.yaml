            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Solo candidatos y mentores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Mentor o perfil de candidato no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /archivos/{tipo}:
    post:
      tags: [archivos]
      operationId: subirArchivo
      summary: Subir un archivo (CV o logo)
      description: >
        Recibe un archivo multipart (campo "archivo") y lo guarda en el
        servidor. tipo=cv acepta PDF/Word; tipo=logo acepta imágenes.
        Máximo 5 MB. Devuelve la URL pública para cv_url / logo_url.
      security:
        - bearerAuth: []
      parameters:
        - name: tipo
          in: path
          required: true
          schema:
            type: string
            enum: [cv, logo]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Archivo guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                        example: http://localhost:4000/uploads/ab12.pdf
                      nombre:
                        type: string
                      tamano:
                        type: integer
        '401':
          description: Sin autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Archivo mayor a 5 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Tipo de archivo no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RutaId:
      name: id
      in: path
      required: true
      description: Identificador del recurso
      schema:
        type: integer
        example: 1

  schemas:
    RegistroRequest:
      type: object
      required: [correo, contrasena, tipo_usuario]
      properties:
        correo:
          type: string
          format: email
          example: ana@ejemplo.com
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: PatronClave123!
        tipo_usuario:
          type: string
          enum: [candidato, empresa, mentor]
          example: candidato
        nombre_completo:
          type: string
          maxLength: 150
          description: Obligatorio de facto para candidato y mentor
          example: Ana Martínez
        nombre_empresa:
          type: string
          maxLength: 150
          description: Nombre de la empresa para el rol empresa
          example: Tecnova

    LoginRequest:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          example: ana@ejemplo.com
        contrasena:
          type: string
          format: password
          example: PatronClave123!

    UsuarioResponse:
      type: object
      properties:
        id_usuario:
          type: integer
          example: 1
        correo:
          type: string
          example: ana@ejemplo.com
        tipo_usuario:
          type: string
          enum: [candidato, empresa, admin, mentor]
        fecha_registro:
          type: string
          format: date-time
        activo:
          type: boolean
          example: true

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT de acceso (15 minutos por defecto)
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Segundos de validez del access token
          example: 900

    CandidatoPerfil:
      type: object
      properties:
